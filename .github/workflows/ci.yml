name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Functional and authorization tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: application/api/requirements.txt application/resource/requirements.txt application/export/requirements.txt
      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r application/api/requirements.txt -r application/resource/requirements.txt -r application/export/requirements.txt
          python -m pip install ./dependency pytest
      - name: Run fresh-environment service tests
        run: python -m pytest -q

  dependency-analysis:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Audit pinned Python dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r application/api/requirements.txt

  sonarqube:
    name: SonarQube static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan with SonarQube
        # Configure SONAR_TOKEN and SONAR_HOST_URL as repository secrets.
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.projectKey=Sarsum_AU-MSc-Sem1-SoftSec-Assignment-1
            -Dsonar.sources=application,dependency
            -Dsonar.tests=tests
            -Dsonar.python.version=3.12

  docker-build:
    name: Build ${{ matrix.dockerfile }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - dockerfile: app-api.Dockerfile
            image: app-api
          - dockerfile: app-export.Dockerfile
            image: app-export
          - dockerfile: app-resource.Dockerfile
            image: app-resource
    steps:
      - uses: actions/checkout@v6
      - name: Build Docker image
        run: docker build --file "${{ matrix.dockerfile }}" --tag "${{ matrix.image }}" .
