services:
  app-api:
    build:
      context: .
      dockerfile: app-api.Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./public.pem:/home/worker/public.pem:ro,z
      - ./private.pem:/home/worker/private.pem:ro,Z
    environment:
      - RESOURCES_BASE_URL=http://app-resource:8000
      - EXPORT_BASE_URL=http://app-export:8000
      - JWT_PRIVKEY_FILE=/home/worker/private.pem
      - JWT_PUBKEY_FILE=/home/worker/public.pem
  app-resource:
    build:
      context: .
      dockerfile: app-resource.Dockerfile
    volumes:
      - ./public.pem:/home/worker/public.pem:ro,z
    environment:
      - JWT_PUBKEY_FILE=/home/worker/public.pem
  app-export:
    build:
      context: .
      dockerfile: app-export.Dockerfile
    volumes:
      - ./public.pem:/home/worker/public.pem:ro,z
    environment:
      - RESOURCES_BASE_URL=http://app-resource:8000
      - JWT_PUBKEY_FILE=/home/worker/public.pem
